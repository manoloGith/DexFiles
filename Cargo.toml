# DexFiles: a modern file manager for Samsung DeX and Android's desktop windowing, in Rust with
# egui, built like the other Dex apps (DexPdfCraft) on craft-android, the shared Android layer
# (the `craft-android/` submodule: mouse, keyboard, lifecycle, diagnostics…).
[workspace]
resolver = "3"
members = ["apps/dexfiles"]
exclude = ["craft-android"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/manoloGith/DexFiles"

[workspace.lints.rust]
# `android_main` and the JNI entry points must be `#[unsafe(no_mangle)]`; nothing else is unsafe.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = "s"

# Decoding thumbnails and previews stays fast.
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.epaint]
opt-level = 3

# The egui and winit that craft-android is built and tested with (storytold's forks; winit with
# craft-android's DeX patches, craft-android/winit/PATCHES.md).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { path = "craft-android/winit" }
